# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brew-haven
spec:
  replicas: 3
  selector:
    matchLabels:
      app: brew-haven
  template:
    metadata:
      labels:
        app: brew-haven
    spec:
      containers:
      - name: brew-haven
        image: YOUR_DOCKER_USERNAME/brew-haven:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: brew-haven-service
spec:
  selector:
    app: brew-haven
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brew-haven-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brew-haven
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50