name: Brew Haven CI/CD

on:
push:
branches:
- main

env:
IMAGE_NAME: parasbajaj/brew-haven

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: echo "SHA_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$SHA_TAG .

      - name: Push Docker Images
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHA_TAG

      - name: Deployment Information
        run: |
          echo "Docker image pushed successfully."
          echo "Tag: $SHA_TAG"
          echo "Run on Minikube:"
          echo "kubectl rollout restart deployment brew-haven"
