# .github/workflows/deploy.yml (Complete version)
name: Build and Deploy to K8s

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/brew-haven:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/brew-haven:latest
      
      - name: Deploy to Kubernetes
        uses: azure/setup-kubectl@v3
      
      - name: Set Kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
      
      - name: Apply to K8s
        run: |
          export KUBECONFIG=./kubeconfig
          kubectl rollout restart deployment brew-haven
          kubectl rollout status deployment brew-haven